<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Subtle glow orb -->
  <circle cx="950" cy="160" r="180" fill="#38bdf8" opacity="0.06" filter="blur(40px)" />
  <circle cx="250" cy="160" r="140" fill="#818cf8" opacity="0.05" filter="blur(40px)" />

  <!-- Accent top border line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-cyan)" />

  <!-- Terminal badge / status pill -->
  <g transform="translate(80, 52)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="28" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Name Title -->
  <text x="80" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Pavan Kumar S</text>

  <!-- Role Gradient Subtitle -->
  <text x="80" y="174" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">Full-Stack Developer • Backend Engineer • AI/ML Enthusiast</text>

  <!-- Tagline -->
  <text x="80" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Building production-ready web platforms, high-performance REST APIs, real-time systems, and AI applications.</text>

  <!-- Divider Line -->
  <line x1="80" y1="242" x2="1120" y2="242" stroke="url(#line-glow)" stroke-width="1.5" />

  <!-- Bottom Core Capability Tags -->
  <g transform="translate(80, 264)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1">⚡ React &amp; Node.js</text>
    </g>
    <g transform="translate(142, 0)">
      <rect width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1">🚀 FastAPI &amp; Python</text>
    </g>
    <g transform="translate(289, 0)">
      <rect width="158" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1">🗄️ PostgreSQL &amp; Prisma</text>
    </g>
    <g transform="translate(459, 0)">
      <rect width="155" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1">🤖 Qdrant &amp; Embeddings</text>
    </g>
    <g transform="translate(626, 0)">
      <rect width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1">🔐 JWT &amp; Role-RBAC</text>
    </g>
  </g>
</svg>