      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent_cyan_indigo" x1="0%" y1="0%" x2="100%" y2="0%">
