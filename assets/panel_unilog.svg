  <text x="48" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; High-throughput data transformation pipeline enforcing an immutable 252-column delivery schema contract across industrial supplier records.</text><text x="48" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; Automated extraction of physical attributes, specifications, and manufacturer vs. commercial brand entity resolution.</text><text x="48" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; Implemented rule-based conflict detection, provenance tracking, and human-in-the-loop review queue with 100% test coverage.</text>

