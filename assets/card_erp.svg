<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent_cyan_indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bar_accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="grid_dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#1e293b" />
    </pattern>
</defs>
  <rect width="1200" height="185" rx="14" fill="url(#bg_card)" stroke="#1e293b" stroke-width="1.3" />
  <rect x="0" y="0" width="5" height="185" rx="2.5" fill="url(#bar_accent)" />

  
  <g opacity="0.15" stroke="#6366f1" stroke-width="1.5" fill="none">
    <polygon points="980,50 1040,50 1070,100 1010,140 950,100" />
