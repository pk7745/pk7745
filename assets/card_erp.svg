  <text x="48" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Enterprise Academic Platform with Anti-Spoofing Geofenced Attendance Workflows</text>

