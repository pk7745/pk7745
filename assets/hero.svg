<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="hero_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="hero_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid_pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>
  </defs>

  <rect width="1200" height="350" rx="16" fill="url(#hero_bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1200" height="350" rx="16" fill="url(#grid_pattern)" />
  <rect x="0" y="0" width="1200" height="3" fill="url(#hero_accent)" />

  <!-- Subtle glow circles -->
  <circle cx="1050" cy="170" r="160" fill="#38bdf8" opacity="0.05" filter="blur(30px)" />
  <circle cx="150" cy="170" r="130" fill="#818cf8" opacity="0.04" filter="blur(30px)" />

  <!-- Status pill -->
  <g transform="translate(60, 42)">
    <rect width="230" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Name -->
  <text x="60" y="128" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Pavan Kumar S</text>
  
  <!-- Role Title -->
  <text x="60" y="172" fill="url(#hero_accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.3">Full-Stack Developer • Backend Engineer • AI/ML Enthusiast</text>
  
  <!-- Tagline -->
  <text x="60" y="212" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Engineering production-ready web platforms, high-throughput REST APIs, distributed databases, and AI systems.</text>

  <!-- Divider Line -->
  <line x1="60" y1="244" x2="1140" y2="244" stroke="url(#glow_line)" stroke-width="1.5" />

  <!-- Capability Pills -->
  <g transform="translate(60, 268)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="146" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1">⚡ React &amp; Node.js</text>
    </g>
    <g transform="translate(158, 0)">
      <rect width="150" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1">🚀 FastAPI &amp; Python</text>
    </g>
    <g transform="translate(320, 0)">
      <rect width="186" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1">🗄️ PostgreSQL &amp; MongoDB</text>
    </g>
    <g transform="translate(518, 0)">
      <rect width="176" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1">🤖 Qdrant &amp; Embeddings</text>
    </g>
    <g transform="translate(706, 0)">
      <rect width="156" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1">🔐 JWT &amp; Role-RBAC</text>
    </g>
  </g>
</svg>