<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="16" fill="url(#bg)" />
  <rect width="1200" height="330" rx="16" fill="url(#grid)" />
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" />

  <g transform="translate(70, 48)">
    <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <text x="70" y="126" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Pavan Kumar S</text>
  <text x="70" y="168" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="0.3">Full-Stack Developer • Backend Engineer • AI/ML Enthusiast</text>
  <text x="70" y="206" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">Engineering production-oriented web platforms, high-throughput REST APIs, and intelligent AI systems.</text>

  <line x1="70" y1="236" x2="1130" y2="236" stroke="url(#glow)" stroke-width="1.5" />

  <g transform="translate(70, 258)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="138" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1">⚡ React &amp; Node.js</text>
    </g>
    <g transform="translate(150, 0)">
      <rect width="144" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1">🚀 FastAPI &amp; Python</text>
    </g>
    <g transform="translate(306, 0)">
      <rect width="170" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1">🗄️ PostgreSQL &amp; Prisma</text>
    </g>
    <g transform="translate(488, 0)">
      <rect width="160" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1">🤖 Qdrant &amp; Embeddings</text>
    </g>
    <g transform="translate(660, 0)">
      <rect width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1">🔐 JWT &amp; Role-RBAC</text>
