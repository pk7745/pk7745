  <text x="48" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; Multi-stage vector retrieval and hybrid ranking system executing similarity matching against 1,070 authentic catalog items in Qdrant.</text><text x="48" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; Hybrid re-ranking formula (S_final = 0.75 * S_visual + 0.25 * S_attribute) utilizing 1024d OpenCLIP and 3D HSV fused color embeddings.</text><text x="48" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&bull; SSRF-protected live webpage fact-verification module with sub-180ms average latency and 100% pass across a 14-group adversarial audit suite.</text>

