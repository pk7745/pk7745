  <rect x="0" y="0" width="5" height="270" rx="2.5" fill="url(#bar_accent)" />

  <g opacity="0.14" stroke="#6366f1" stroke-width="1.2" fill="none"><circle cx="1020" cy="100" r="45" /><circle cx="1020" cy="100" r="28" /><circle cx="1020" cy="100" r="12" /></g>

  <g transform="translate(48, 26)">
