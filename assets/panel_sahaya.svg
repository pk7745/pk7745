  <g opacity="0.15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"><line x1="940" y1="80" x2="940" y2="110" /><line x1="960" y1="65" x2="960" y2="125" /><line x1="980" y1="50" x2="980" y2="140" /><line x1="1000" y1="70" x2="1000" y2="120" /><line x1="1020" y1="55" x2="1020" y2="135" /></g>

