  <text x="48" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">URL Shortener API — High-Performance REST Service</text>
  <text x="48" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">Lightweight, persistent RESTful web service for URL shortening, validation, and redirection.</text>

  <text x="48" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&#8226; Production-ready API service converting long HTTP/HTTPS URLs into compact Base62 short codes with automatic HTTP 307 redirects.</text><text x="48" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&#8226; Collision-resistant short code generator with database-level unique constraints and retry mechanisms.</text><text x="48" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">&#8226; Complete PostgreSQL persistence without in-memory state dependencies, featuring OpenAPI/Swagger documentation and Pydantic validation.</text>

